# Supabase free-tier projects are paused automatically after 7 days of inactivity.
# This workflow sends a lightweight read request every 3 days to keep the project active.

name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 06:00 UTC every 3 days
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send lightweight read request to Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: SUPABASE_URL or SUPABASE_ANON_KEY secret is not configured in GitHub repository secrets."
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${SUPABASE_URL%/}"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$CLEAN_URL/rest/v1/cars?select=id&limit=1")

          echo "Supabase response code: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Keep-alive check failed. Expected HTTP 200, got $HTTP_CODE."
            exit 1
          fi

          echo "Keep-alive check succeeded (HTTP 200). Supabase project is active."
